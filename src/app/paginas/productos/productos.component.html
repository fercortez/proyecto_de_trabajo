<link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">


<style>
  h1.text-center {
    font-family: 'Oswald', sans-serif;
  }
</style>


<style>
  h1.text-center {
    font-family: 'Oswald', sans-serif;
    color: var(--primary-color);
    margin: 20px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 2.2rem;
  }

  /* Filtros compactos */
  .filtros-compactos {
    max-width: 700px;

    margin: 0 auto 30px;
  }

  /* parte de arriba  */
  .filtro-toggle {
    background-color: #38475c;
    color: white;
    border: none;
    border-radius: 12px 12px 12px 12px;
    padding: 12px 20px;
    font-weight: 600;
    width: 100%;
    text-align: left;

    position: relative;

  }


  /* seccion desplegable  */
  .filtros-content {
    background-color: #38475c;
    border-radius: 0 0 12px 12px;
    padding: 20px;
    margin-top: -5px;
    border-top: none;
  }

  /* campos de dentro  */
  .filtros-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    align-items: end;
  }


  .filtro-group label {
    font-weight: 600;
    color: var(--primary-color);
    margin-bottom: 6px;
    font-size: 0.85rem;
    display: block;
  }


  /* boton de limpiar  */
  .btn-clean {
    background: var(--accent-color);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
    height: fit-content;
    background-color: #3d2d67;
  }

  .btn-clean:hover {
    background: #281e42;
    transform: translateY(-1px);
  }
</style>





<h1 class="text-center">Productos</h1>



<div class="filtros-compactos">
  <button class="filtro-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#filtrosCollapse"
    aria-expanded="false" aria-controls="filtrosCollapse">
    <i class="fas fa-filter"></i> Filtros de Productos
  </button>

  <div class="collapse" id="filtrosCollapse">
    <div class="filtros-content">
      <div class="filtros-grid">
        <div class="filtro-group">
          <label>Categoría:</label>
          <select class="form-select" [(ngModel)]="selectedCategory" name="categoria">
            <option value="">Todas</option>
            <option *ngFor="let categoria of categories" [value]="categoria">{{categoria}}</option>
          </select>
        </div>

        <div class="filtro-group">
          <label>Marca:</label>
          <select class="form-select" [(ngModel)]="selectedBrand" name="marca">
            <option value="">Todas</option>
            <option *ngFor="let marca of marcas" [value]="marca">{{marca}}</option>
          </select>
        </div>

        <div class="filtro-group">
          <label>Precio min:</label>
          <input type="number" class="form-control" [(ngModel)]="minprecio" name="minprecio" placeholder="Mínimo">
        </div>

        <div class="filtro-group">
          <label>Precio max:</label>
          <input type="number" class="form-control" [(ngModel)]="maxprecio" name="maxprecio" placeholder="Máximo">
        </div>

        <div class="filtro-group d-flex align-items-end">
          <button class="btn-clean w-100" (click)="resetFilters()">
            <i class="fas fa-broom"></i> Limpiar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>



<div class="caja-color">

    <ng-container *ngIf="Productos && Productos.length">
      <ng-container *ngFor="let producto of Productos">

          <div class="card-body">
            <h2 class="card-title">{{ producto.nombre }}</h2>
            <p class="card-text">{{ producto.descripcion }}</p>
            <p class="card-price">Precio: {{ producto.precio}}</p>
